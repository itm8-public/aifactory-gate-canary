# Check for 0.5.0: a caller that grants only what the customer template granted before 0.5.0
# (contents: read, id-token: write; no actions: read, no pull-requests: write), as Oral Care's does.
# GitHub must start the gate, the verdict must be pass, a push runs in full (no reuse) and the
# comment job must not fail. The pull request goes into canary-legacy/base, so its change is one
# README line and not this file.
name: aifactory gate

on:
  pull_request:
    branches: [main, 'canary-legacy/base']
  push:
    branches: ['canary-push/**']

permissions:
  contents: read
  id-token: write # the gate signs in to itm8's review Foundry with GitHub OIDC when ai-review is on

jobs:
  gate:
    uses: itm8-public/aifactory-gate/.github/workflows/gate.yml@v0-next
    with:
      zone: green
      level: 2
      node-version: '24'
      test-command: npm test
      ai-review: false
