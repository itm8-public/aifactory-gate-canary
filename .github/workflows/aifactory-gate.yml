# The canary case canary-legacy/case (scripts/canary.mjs in itm8-public/aifactory-gate): a caller
# that grants only what the customer template granted before gate 0.5.0 (contents: read,
# id-token: write; no actions: read, no pull-requests: write), as callers that predate it still do.
# GitHub must start the gate, the verdict must be pass with no comment, no gate job may fail, and
# the push of its merge to canary-push/legacy must run in full (no reuse without actions: read).
# The pull request goes into canary-legacy/base, which holds this caller, so the case's change is
# one README line and not this file. Do not merge or delete these branches.
name: aifactory gate

on:
  pull_request:
    branches: [main, 'canary-legacy/base']
  push:
    branches: ['canary-push/**']

permissions:
  contents: read
  id-token: write # the gate signs in to itm8's review Foundry with GitHub OIDC when ai-review is on

jobs:
  gate:
    uses: itm8-public/aifactory-gate/.github/workflows/gate.yml@v0-next
    with:
      zone: green
      level: 2
      node-version: '24'
      test-command: npm test
      ai-review: false
